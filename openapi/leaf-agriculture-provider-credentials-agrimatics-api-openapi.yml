openapi: 3.2.0
info:
  title: Leaf Provider Credentials > Agrimatics API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Provider Credentials > Agrimatics
paths:
  /services/usermanagement/api/users/{leafUserId}/agrimatics-credentials:
    get:
      tags:
      - Provider Credentials > Agrimatics
      summary: Get Agrimatics credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdAgrimaticsCredentials
      x-operation-id-source: derived
    post:
      tags:
      - Provider Credentials > Agrimatics
      summary: Add Agrimatics credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
      operationId: postServicesUsermanagementApiUsersByLeafUserIdAgrimaticsCredentials
      x-operation-id-source: derived
    delete:
      tags:
      - Provider Credentials > Agrimatics
      summary: Delete Agrimatics credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: deleteServicesUsermanagementApiUsersByLeafUserIdAgrimaticsCredentials
      x-operation-id-source: derived
  /services/usermanagement/api/users/{leafUserId}/agrimatics-credentials/events:
    get:
      tags:
      - Provider Credentials > Agrimatics
      summary: Get Agrimatics credential events
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdAgrimaticsCredentialsEvents
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
