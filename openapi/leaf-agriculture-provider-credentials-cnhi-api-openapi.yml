openapi: 3.2.0
info:
  title: Leaf Provider Credentials > CNHi API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Provider Credentials > CNHi
paths:
  /services/usermanagement/api/users/{leafUserId}/cnhi-credentials:
    get:
      tags:
      - Provider Credentials > CNHi
      summary: Get CNHi credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdCnhiCredentials
      x-operation-id-source: derived
    post:
      tags:
      - Provider Credentials > CNHi
      summary: Add CNHi credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
      operationId: postServicesUsermanagementApiUsersByLeafUserIdCnhiCredentials
      x-operation-id-source: derived
    delete:
      tags:
      - Provider Credentials > CNHi
      summary: Delete CNHi credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: deleteServicesUsermanagementApiUsersByLeafUserIdCnhiCredentials
      x-operation-id-source: derived
  /services/usermanagement/api/users/{leafUserId}/cnhi-credentials/events:
    get:
      tags:
      - Provider Credentials > CNHi
      summary: Get CNHi credential events
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdCnhiCredentialsEvents
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
