openapi: 3.2.0
info:
  title: Leaf Authentication > Trimble API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Authentication > Trimble
paths:
  /api/oauth/trimble/get-url:
    post:
      tags:
      - Authentication > Trimble
      summary: Get Trimble auth URL
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application_name:
                  type: string
                client_id:
                  type: string
                client_redirect_url:
                  type: string
      responses:
        '200':
          description: Successful response
      operationId: postApiOauthTrimbleGetUrl
      x-operation-id-source: derived
  /api/oauth/trimble/get-token:
    post:
      tags:
      - Authentication > Trimble
      summary: Get Trimble Token
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                redirect_url:
                  type: string
                client_secret:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Successful response
      operationId: postApiOauthTrimbleGetToken
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
