openapi: 3.2.0
info:
  title: Leaf Magic Link > Authentication API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Magic Link > Authentication
paths:
  /services/widgets/api/magic-link/authentication:
    get:
      operationId: getAllAuthMagicLinks
      summary: Get all auth magic links
      tags:
      - Magic Link > Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /services/widgets/api/magic-link/authentication/{magicLinkId}:
    get:
      operationId: getAuthMagicLink
      summary: Get an auth magic link
      tags:
      - Magic Link > Authentication
      security:
      - bearerAuth: []
      parameters:
      - name: magicLinkId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    delete:
      operationId: deleteAuthMagicLink
      summary: Delete auth magic link
      tags:
      - Magic Link > Authentication
      security:
      - bearerAuth: []
      parameters:
      - name: magicLinkId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /services/widgets/api/magic-link/users/{leafUserId}/authentication:
    post:
      operationId: createAuthMagicLink
      summary: Create auth magic link
      tags:
      - Magic Link > Authentication
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresIn:
                  type: integer
                provider:
                  type: string
                settings:
                  type: object
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
