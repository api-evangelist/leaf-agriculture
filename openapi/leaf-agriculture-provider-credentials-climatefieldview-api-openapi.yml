openapi: 3.2.0
info:
  title: Leaf Provider Credentials > ClimateFieldView API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Provider Credentials > ClimateFieldView
paths:
  /services/usermanagement/api/users/{leafUserId}/climate-field-view-credentials:
    get:
      tags:
      - Provider Credentials > ClimateFieldView
      summary: Get ClimateFieldView credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdClimateFieldViewCredentials
      x-operation-id-source: derived
    post:
      tags:
      - Provider Credentials > ClimateFieldView
      summary: Add ClimateFieldView credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
      operationId: postServicesUsermanagementApiUsersByLeafUserIdClimateFieldViewCredentials
      x-operation-id-source: derived
    delete:
      tags:
      - Provider Credentials > ClimateFieldView
      summary: Delete ClimateFieldView credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: deleteServicesUsermanagementApiUsersByLeafUserIdClimateFieldViewCredentials
      x-operation-id-source: derived
  /services/usermanagement/api/users/{leafUserId}/climate-field-view-credentials/events:
    get:
      tags:
      - Provider Credentials > ClimateFieldView
      summary: Get ClimateFieldView credential events
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdClimateFieldViewCredentialsEvents
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
