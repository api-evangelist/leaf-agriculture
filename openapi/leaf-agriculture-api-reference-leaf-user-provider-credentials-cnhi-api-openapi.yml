openapi: 3.0.0
info:
  title: Leaf Agriculture Leaf API Reference > Alerts API Reference > Leaf User > Provider Credentials > CNHi API
  description: We are Leaf Agriculture, provider of a unified farm data API. After experiencing the difficulty of building applications in food and agriculture first hand as software developers, and hearing similar stories of frustration with existing tools and often insurmountable technical barriers from other companies, we decided to tackle the problem at hand.
  version: 1.0.0
tags:
- name: API Reference > Leaf User > Provider Credentials > CNHi
paths:
  /services/usermanagement/api/users/{leaf_user_id}/cnhi-credentials:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > CNHi
      summary: Leaf Agriculture Get CNHi credentials of the LeafUser
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - API Reference > Leaf User > Provider Credentials > CNHi
      summary: Leaf Agriculture Add CNHi credentials to LeafUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                clientId: '{{cnhi_client_id}}'
                clientSecret: '{{cnhi_client_secret}}'
                clientEnvironment: '{{cnhi_client_environment}}'
                subscriptionKey: '{{cnhi_subscription_key}}'
                refreshToken: '{{cnhi_refresh_token}}'
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - API Reference > Leaf User > Provider Credentials > CNHi
      summary: Leaf Agriculture Delete CNHi credentials of the LeafUser
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /services/usermanagement/api/users/{leaf_user_id}/cnhi-credentials/events:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > CNHi
      summary: Leaf Agriculture Get CNHI credentials Events
      security:
      - bearerAuth: []
      parameters:
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
