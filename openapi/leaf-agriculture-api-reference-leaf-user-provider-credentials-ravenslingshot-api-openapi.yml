openapi: 3.0.0
info:
  title: Leaf Agriculture Leaf API Reference > Alerts API Reference > Leaf User > Provider Credentials > RavenSlingshot API
  description: We are Leaf Agriculture, provider of a unified farm data API. After experiencing the difficulty of building applications in food and agriculture first hand as software developers, and hearing similar stories of frustration with existing tools and often insurmountable technical barriers from other companies, we decided to tackle the problem at hand.
  version: 1.0.0
tags:
- name: API Reference > Leaf User > Provider Credentials > RavenSlingshot
paths:
  /services/usermanagement/api/users/{leaf_user_id}/raven-slingshot-credentials:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > RavenSlingshot
      summary: Leaf Agriculture Get RavenSlingshot credentials of the LeafUser
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - API Reference > Leaf User > Provider Credentials > RavenSlingshot
      summary: Leaf Agriculture Add RavenSlingshot credentials to the LeafUser
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n    \"apiKey\": \"{{ravenslingshot_api_key}}\",\n    \"accessKey\": \"{{ravenslingshot_access_key}}\",\n    \"sharedSecret\":  \"{{ravenslingshot_shared_secret}}\"\n}"'
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - API Reference > Leaf User > Provider Credentials > RavenSlingshot
      summary: Leaf Agriculture Delete RavenSlingshot credentials of the LeafUser
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /services/usermanagement/api/users/{leaf_user_id}/raven-slingshot-credentials/events:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > RavenSlingshot
      summary: Leaf Agriculture Get RavenSlingshot credentials Events
      security:
      - bearerAuth: []
      parameters:
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
