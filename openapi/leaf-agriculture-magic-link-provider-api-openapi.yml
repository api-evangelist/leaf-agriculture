openapi: 3.2.0
info:
  title: Leaf Magic Link > Provider API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Magic Link > Provider
paths:
  /services/widgets/api/magic-link/provider:
    get:
      operationId: getAllProviderMagicLinks
      summary: Get all provider magic links
      tags:
      - Magic Link > Provider
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /services/widgets/api/magic-link/provider/{magicLinkId}:
    get:
      operationId: getProviderMagicLink
      summary: Get a provider magic link
      tags:
      - Magic Link > Provider
      security:
      - bearerAuth: []
      parameters:
      - name: magicLinkId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    delete:
      operationId: deleteProviderMagicLink
      summary: Delete provider magic link
      tags:
      - Magic Link > Provider
      security:
      - bearerAuth: []
      parameters:
      - name: magicLinkId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /services/widgets/api/magic-link/users/{leafUserId}/provider:
    post:
      operationId: createProviderMagicLink
      summary: Create provider magic link
      tags:
      - Magic Link > Provider
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresIn:
                  type: integer
                allowedProviders:
                  type: array
                  items:
                    type: string
                settings:
                  type: object
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
