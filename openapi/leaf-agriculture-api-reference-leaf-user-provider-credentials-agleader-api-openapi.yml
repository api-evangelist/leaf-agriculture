openapi: 3.0.0
info:
  title: Leaf Agriculture Leaf API Reference > Alerts API Reference > Leaf User > Provider Credentials > AgLeader API
  description: We are Leaf Agriculture, provider of a unified farm data API. After experiencing the difficulty of building applications in food and agriculture first hand as software developers, and hearing similar stories of frustration with existing tools and often insurmountable technical barriers from other companies, we decided to tackle the problem at hand.
  version: 1.0.0
tags:
- name: API Reference > Leaf User > Provider Credentials > AgLeader
paths:
  /services/usermanagement/api/users/{leaf_user_id}/ag-leader-credentials:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > AgLeader
      summary: Leaf Agriculture Get AgLeader credentials from Leaf User
      security:
      - noauthAuth: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - API Reference > Leaf User > Provider Credentials > AgLeader
      summary: Leaf Agriculture Add AgLeader credentials to a Leaf User
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n  \"accessToken\": \"{{agleader_bearer_token}}\",\n  \"refreshToken\": \"{{agleader_refresh_token}}\",\n  \"publicKey\": \"{{agleader_public_key}}\",\n  \"privateKey\": \"{{agleader_private_key}}\"\n}"'
      security:
      - noauthAuth: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - API Reference > Leaf User > Provider Credentials > AgLeader
      summary: Leaf Agriculture Delete AgLeader credentials from a Leaf User
      security:
      - noauthAuth: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /services/usermanagement/api/users/{leaf_user_id}/ag-leader-credentials/events:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > AgLeader
      summary: Leaf Agriculture Get AgLeader credentials Events
      security:
      - bearerAuth: []
      parameters:
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
