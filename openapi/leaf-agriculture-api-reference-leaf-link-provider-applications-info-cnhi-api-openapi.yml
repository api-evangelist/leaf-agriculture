        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: app_name
        in: path
        schema:
          type: string
        required: true
      - name: cnhi_client_environment
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
