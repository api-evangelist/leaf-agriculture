      tags:
      - API Reference > Leaf Link > Provider Applications Info > John Deere
      summary: Leaf Agriculture Get all John Deere app information
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      responses:
        '200':
          description: Successful response
          content:
