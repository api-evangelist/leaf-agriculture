openapi: 3.0.0
info:
  title: Leaf Agriculture Leaf API Reference > Alerts API Reference > Leaf User > Provider Credentials > Lindsay API
  description: We are Leaf Agriculture, provider of a unified farm data API. After experiencing the difficulty of building applications in food and agriculture first hand as software developers, and hearing similar stories of frustration with existing tools and often insurmountable technical barriers from other companies, we decided to tackle the problem at hand.
  version: 1.0.0
tags:
- name: API Reference > Leaf User > Provider Credentials > Lindsay
paths:
  /services/usermanagement/api/users/{leaf_user_id}/lindsay-credentials:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > Lindsay
      summary: Leaf Agriculture Get Lindsay credentials of the LeafUser
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - API Reference > Leaf User > Provider Credentials > Lindsay
      summary: Leaf Agriculture Add Lindsay credentials to the LeafUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                clientId: '{{lindsay_client_id}}'
                clientSecret: '{{lindsay_client_secret}}'
                refreshToken: '{{lindsay_refresh_token}}'
                clientEnvironment: STAGE
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - API Reference > Leaf User > Provider Credentials > Lindsay
      summary: Leaf Agriculture Delete Lindsay credentials of the LeafUser
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /services/usermanagement/api/users/{leaf_user_id}/lindsay-credentials/events:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > Lindsay
      summary: Leaf Agriculture Get Lindsay credentials Events
      security:
      - bearerAuth: []
      parameters:
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
