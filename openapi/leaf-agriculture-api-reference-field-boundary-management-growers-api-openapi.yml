openapi: 3.0.0
info:
  title: Leaf Agriculture Leaf API Reference > Alerts API Reference > Field Boundary Management > Growers API
  description: We are Leaf Agriculture, provider of a unified farm data API. After experiencing the difficulty of building applications in food and agriculture first hand as software developers, and hearing similar stories of frustration with existing tools and often insurmountable technical barriers from other companies, we decided to tackle the problem at hand.
  version: 1.0.0
tags:
- name: API Reference > Field Boundary Management > Growers
paths:
  /services/fields/api/growers:
    get:
      tags:
      - API Reference > Field Boundary Management > Growers
      summary: Leaf Agriculture Get all growers
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /services/fields/api/growers/{grower_id}:
    get:
      tags:
      - API Reference > Field Boundary Management > Growers
      summary: Leaf Agriculture Get a grower
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: grower_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /services/fields/api/users/{leaf_user_id}/growers:
    post:
      tags:
      - API Reference > Field Boundary Management > Growers
      summary: Leaf Agriculture Create a grower
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Example Grower Name
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /services/fields/api/users/{leaf_user_id}/growers/{grower_id}:
    put:
      tags:
      - API Reference > Field Boundary Management > Growers
      summary: Leaf Agriculture Update a grower
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Example Grower Name
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      - name: grower_id
        in: path
        schema:
          type: string
        required: true
      responses:
