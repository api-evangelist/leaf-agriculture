    get:
      tags:
      - API Reference > Machine File Conversion
      summary: Leaf Agriculture Get all files
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getServicesOperationsApiFiles
      x-operation-id-source: derived
