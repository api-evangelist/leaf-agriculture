  /services/operations/api/files/merge:
    post:
      tags:
      - API Reference > Machine File Conversion
      summary: Leaf Agriculture Merge operation files
      description: 'Make sure you are merging operations of the

        - same operationType (PLANTED, HARVESTED or APPLIED)

        - same Leaf User'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
