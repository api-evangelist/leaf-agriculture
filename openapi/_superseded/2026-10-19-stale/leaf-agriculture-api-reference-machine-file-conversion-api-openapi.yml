        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: leafUserId
        in: query
        schema:
          type: string
        example: '{{leaf_user_id}}'
      - name: provider
        in: query
        schema:
          type: string
        example: Other
      responses:
