openapi: 3.2.0
info:
  title: Leaf Provider Credentials > Stara API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Provider Credentials > Stara
paths:
  /services/usermanagement/api/users/{leafUserId}/stara-credentials:
    get:
      tags:
      - Provider Credentials > Stara
      summary: Get Stara credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdStaraCredentials
      x-operation-id-source: derived
    post:
      tags:
      - Provider Credentials > Stara
      summary: Add Stara credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
      operationId: postServicesUsermanagementApiUsersByLeafUserIdStaraCredentials
      x-operation-id-source: derived
    delete:
      tags:
      - Provider Credentials > Stara
      summary: Delete Stara credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: deleteServicesUsermanagementApiUsersByLeafUserIdStaraCredentials
      x-operation-id-source: derived
  /services/usermanagement/api/users/{leafUserId}/stara-credentials/events:
    get:
      tags:
      - Provider Credentials > Stara
      summary: Get Stara credential events
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdStaraCredentialsEvents
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
