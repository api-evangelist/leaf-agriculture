openapi: 3.2.0
info:
  title: Leaf Link > Stara App Keys API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Leaf Link > Stara App Keys
paths:
  /services/usermanagement/api/app-keys/Stara:
    get:
      operationId: getAllStaraAppKeys
      summary: Get all Stara app keys
      tags:
      - Leaf Link > Stara App Keys
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      operationId: createStaraAppKey
      summary: Create Stara app key
      tags:
      - Leaf Link > Stara App Keys
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /services/usermanagement/api/app-keys/Stara/{appName}:
    get:
      operationId: getStaraAppKey
      summary: Get a Stara app key
      tags:
      - Leaf Link > Stara App Keys
      security:
      - bearerAuth: []
      parameters:
      - name: appName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    put:
      operationId: updateStaraAppKey
      summary: Update Stara app key
      tags:
      - Leaf Link > Stara App Keys
      security:
      - bearerAuth: []
      parameters:
      - name: appName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
    delete:
      operationId: deleteStaraAppKey
      summary: Delete Stara app key
      tags:
      - Leaf Link > Stara App Keys
      security:
      - bearerAuth: []
      parameters:
      - name: appName
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
