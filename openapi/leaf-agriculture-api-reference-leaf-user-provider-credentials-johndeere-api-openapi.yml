openapi: 3.0.0
info:
  title: Leaf Agriculture Leaf API Reference > Alerts API Reference > Leaf User > Provider Credentials > JohnDeere API
  description: We are Leaf Agriculture, provider of a unified farm data API. After experiencing the difficulty of building applications in food and agriculture first hand as software developers, and hearing similar stories of frustration with existing tools and often insurmountable technical barriers from other companies, we decided to tackle the problem at hand.
  version: 1.0.0
tags:
- name: API Reference > Leaf User > Provider Credentials > JohnDeere
paths:
  /services/usermanagement/api/users/{leaf_user_id}/john-deere-credentials:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > JohnDeere
      summary: Leaf Agriculture Get JohnDeere credentials of the LeafUser
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - API Reference > Leaf User > Provider Credentials > JohnDeere
      summary: Leaf Agriculture Add JohnDeere credentials to the LeafUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                clientKey: '{{jd_client_id}}'
                clientSecret: '{{jd_client_secret}}'
                refreshToken: '{{jd_refresh_token}}'
                clientEnvironment: '{jd_client_environment}'
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - API Reference > Leaf User > Provider Credentials > JohnDeere
      summary: Leaf Agriculture Delete JohnDeere credentials of the LeafUser
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /services/usermanagement/api/users/{leaf_user_id}/john-deere-credentials/events:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > JohnDeere
      summary: Leaf Agriculture Get JohnDeere credentials Events
      security:
      - bearerAuth: []
      parameters:
      - name: leaf_user_id
        in: path
        schema:
          type: string
