openapi: 3.2.0
info:
  title: Leaf Link > RavenSlingshot App Keys API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Leaf Link > RavenSlingshot App Keys
paths:
  /services/usermanagement/api/app-keys/RavenSlingshot:
    get:
      operationId: getAllRavenSlingshotAppKeys
      summary: Get all RavenSlingshot app keys
      tags:
      - Leaf Link > RavenSlingshot App Keys
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      operationId: createRavenSlingshotAppKey
      summary: Create RavenSlingshot app key
      tags:
      - Leaf Link > RavenSlingshot App Keys
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /services/usermanagement/api/app-keys/RavenSlingshot/{appName}:
    get:
      operationId: getRavenSlingshotAppKey
      summary: Get a RavenSlingshot app key
      tags:
      - Leaf Link > RavenSlingshot App Keys
      security:
      - bearerAuth: []
      parameters:
      - name: appName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    put:
      operationId: updateRavenSlingshotAppKey
      summary: Update RavenSlingshot app key
      tags:
      - Leaf Link > RavenSlingshot App Keys
      security:
      - bearerAuth: []
      parameters:
      - name: appName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
    delete:
      operationId: deleteRavenSlingshotAppKey
      summary: Delete RavenSlingshot app key
      tags:
      - Leaf Link > RavenSlingshot App Keys
      security:
      - bearerAuth: []
      parameters:
      - name: appName
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Leaf Agriculture
  source: https://docs.withleaf.io/openapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
