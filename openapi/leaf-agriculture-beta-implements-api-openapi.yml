openapi: 3.2.0
info:
  title: Leaf Beta > Implements API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Beta > Implements
paths:
  /services/beta/api/users/{leafUserId}/implements:
    get:
      tags:
      - Beta > Implements
      summary: Get all implements
      operationId: getAllImplements
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: size
        in: query
        schema:
          type: integer
      - name: sort
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      - name: provider
        in: query
        schema:
          type: string
      - name: providerOrganizationId
        in: query
        schema:
          type: string
      - name: createdTime
        in: query
        schema:
          type: string
      - name: providerImplementId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
  /services/beta/api/users/{leafUserId}/implements/{implementId}:
    get:
      tags:
      - Beta > Implements
      summary: Get an implement
      operationId: getImplement
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
      - name: implementId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
