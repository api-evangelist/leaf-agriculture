openapi: 3.0.0
info:
  title: Leaf Agriculture Leaf API Reference > Alerts API Reference > Leaf User > Provider Credentials > Sentera API
  description: We are Leaf Agriculture, provider of a unified farm data API. After experiencing the difficulty of building applications in food and agriculture first hand as software developers, and hearing similar stories of frustration with existing tools and often insurmountable technical barriers from other companies, we decided to tackle the problem at hand.
  version: 1.0.0
tags:
- name: API Reference > Leaf User > Provider Credentials > Sentera
paths:
  /services/usermanagement/api/users/{leaf_user_id}/sentera-credentials:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > Sentera
      summary: Leaf Agriculture Get Sentera credentials from Leaf User
      security:
      - noauthAuth: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - API Reference > Leaf User > Provider Credentials > Sentera
      summary: Leaf Agriculture Add Sentera credentials to a Leaf User
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n  \"username\": \"{{sentera_username}}\" ,\n  \"password\": \"{{sentera_password}}\",\n  \"organizationName\": \"{{sentera_organization_name}}\"\n}"'
      security:
      - noauthAuth: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - API Reference > Leaf User > Provider Credentials > Sentera
      summary: Leaf Agriculture Delete Sentera credentials from a Leaf User
      security:
      - noauthAuth: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{leaf_token}}
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /services/usermanagement/api/users/{leaf_user_id}/sentera-credentials/events:
    get:
      tags:
      - API Reference > Leaf User > Provider Credentials > Sentera
      summary: Leaf Agriculture Get Sentera credentials Events
      security:
      - bearerAuth: []
      parameters:
      - name: leaf_user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
