openapi: 3.2.0
info:
  title: Leaf Provider Credentials > Trimble API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Provider Credentials > Trimble
paths:
  /services/usermanagement/api/users/{leafUserId}/trimble-credentials:
    get:
      tags:
      - Provider Credentials > Trimble
      summary: Get Trimble credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdTrimbleCredentials
      x-operation-id-source: derived
    post:
      tags:
      - Provider Credentials > Trimble
      summary: Add Trimble credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
      operationId: postServicesUsermanagementApiUsersByLeafUserIdTrimbleCredentials
      x-operation-id-source: derived
    delete:
      tags:
      - Provider Credentials > Trimble
      summary: Delete Trimble credentials
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: deleteServicesUsermanagementApiUsersByLeafUserIdTrimbleCredentials
      x-operation-id-source: derived
  /services/usermanagement/api/users/{leafUserId}/trimble-credentials/events:
    get:
      tags:
      - Provider Credentials > Trimble
      summary: Get Trimble credential events
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
      operationId: getServicesUsermanagementApiUsersByLeafUserIdTrimbleCredentialsEvents
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
