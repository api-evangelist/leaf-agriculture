openapi: 3.2.0
info:
  title: Leaf Beta > Operators API
  description: Food and Agriculture developers use Leaf's API to access clean, standardized, and aggregated Farm data from all major sources.
  version: 1.0.0
servers:
- url: https://api.withleaf.io
security:
- bearerAuth: []
tags:
- name: Beta > Operators
paths:
  /services/beta/api/users/{leafUserId}/operators:
    get:
      tags:
      - Beta > Operators
      summary: Get all operators
      operationId: getAllOperators
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: size
        in: query
        schema:
          type: integer
      - name: provider
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
  /services/beta/api/users/{leafUserId}/operators/{operatorId}:
    get:
      tags:
      - Beta > Operators
      summary: Get an operator
      operationId: getOperator
      security:
      - bearerAuth: []
      parameters:
      - name: leafUserId
        in: path
        required: true
        schema:
          type: string
      - name: operatorId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Leaf Agriculture
  source: https://docs.withleaf.io/openapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
