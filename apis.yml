aid: leaf-agriculture
name: Leaf Agriculture
description: >-
  Leaf Agriculture is the provider of a unified farm data API. The platform addresses the difficulty of building
  applications in food and agriculture by providing a standardized API for accessing data from multiple farm data
  sources, including field boundaries, machine operations (planting, harvest, application, tillage), weather data,
  provider integrations (John Deere, CNHi, Climate FieldView, Trimble), webhooks for real-time notifications, and Leaf
  Lake for SQL-based analysis of normalized farm data.
type: Index
accessModel:
  pricing: freemium
  onboarding: unknown
  trial: false
  try_now: false
  public: false
  label: Freemium
  confidence: medium
  source:
  - plans
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/leaf-agriculture.png
tags:
  - Agriculture
  - Farm Data
  - Field Boundaries
  - Machine Operations
  - Provider Integrations
  - Unified API
  - Weather
  - Webhooks
